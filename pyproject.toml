[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "requests-utls"
version = "0.1.0"
description = "Concurrent Python HTTP client backed by a separate uTLS Go engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "requests-utls contributors"}]
dependencies = ["cffi>=1.16"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
requests_utls = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
