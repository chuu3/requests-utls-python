[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "requests-utls"
version = "0.2.2"
description = "Concurrent HTTP client with a bundled uTLS engine and precise TLS/HTTP2 profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "requests-utls contributors"}]
dependencies = ["cffi>=1.16"]

[project.urls]
Repository = "https://github.com/chuu3/requests-utls-python"
"Go engine" = "https://github.com/chuu3/requests-utls"

[project.optional-dependencies]
test = ["pytest>=8", "setuptools>=77", "wheel"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
requests_utls = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
