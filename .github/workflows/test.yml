name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      REQUESTS_UTLS_PURE_PYTHON: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python package and test dependencies
        run: python -m pip install '.[test]'
      - name: Run unit tests without native artifacts
        run: python -m pytest tests/test_models.py tests/test_session_options.py tests/test_response_cookies.py tests/test_request_headers.py tests/test_profile_acceptance.py tests/test_build_backend.py tests/test_bundled.py tests/test_finalize_wheel.py tests/test_validation.py tests/test_async_lifecycle.py -q

  native:
    name: Linux native integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Read and validate the pinned engine revision
        id: engine-lock
        run: python scripts/ci_wheel.py lock-outputs
      - name: Check out the pinned Go engine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.engine-lock.outputs.repository }}
          ref: ${{ steps.engine-lock.outputs.commit }}
          path: engine
          # Private checkouts use the read-only deploy key. An unavailable key
          # is empty on fork PRs; once public, the engine is fetched over HTTPS.
          ssh-key: ${{ secrets.GO_ENGINE_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ steps.engine-lock.outputs.go_version }}
          cache: false
      - name: Set explicit native artifact paths
        run: |
          requests_utls_native_dir="$RUNNER_TEMP/requests-utls-native"
          mkdir -p "$requests_utls_native_dir"
          printf 'REQUESTS_UTLS_LIBRARY=%s/librequests_utls.so\n' "$requests_utls_native_dir" >> "$GITHUB_ENV"
          printf 'REQUESTS_UTLS_TEST_PEER=%s/requests-utls-testpeer\n' "$requests_utls_native_dir" >> "$GITHUB_ENV"
      - name: Build the shared library and independent local test peer
        working-directory: engine
        run: |
          go build -mod=readonly -trimpath -buildvcs=false -buildmode=c-shared -o "$REQUESTS_UTLS_LIBRARY" ./cmd/requests-utls-shared
          go build -mod=readonly -trimpath -buildvcs=false -o "$REQUESTS_UTLS_TEST_PEER" ./cmd/requests-utls-testpeer
      - name: Install Python source and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run the complete suite with the pinned native engine
        run: python -m pytest -q tests
