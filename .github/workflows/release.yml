name: Build and publish bundled wheels

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all five tested wheels to PyPI
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux_x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            platform: linux_aarch64
            image: quay.io/pypa/manylinux_2_28_aarch64
          - runner: macos-15
            platform: macosx_13_0_arm64
            image: ""
          - runner: macos-15-intel
            platform: macosx_13_0_x86_64
            image: ""
          - runner: windows-2022
            platform: win_amd64
            image: ""
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Read and validate the pinned engine revision
        id: engine-lock
        run: python scripts/ci_wheel.py lock-outputs
      - name: Check out the private Go engine at its exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.engine-lock.outputs.repository }}
          ref: ${{ steps.engine-lock.outputs.commit }}
          path: engine
          ssh-key: ${{ secrets.GO_ENGINE_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ steps.engine-lock.outputs.go_version }}
          cache: false
      - name: Install MinGW-w64 UCRT compiler
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add the Windows compiler to PATH
        if: runner.os == 'Windows'
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          python -c "import os,pathlib; p=pathlib.Path(os.environ['MSYS2_LOCATION'])/'ucrt64'/'bin'; pathlib.Path(os.environ['GITHUB_PATH']).open('a').write(str(p)+'\n')"
      - name: Build, audit and test Linux inside the manylinux baseline
        if: runner.os == 'Linux'
        shell: bash
        env:
          MANYLINUX_IMAGE: ${{ matrix.image }}
          WHEEL_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          go_root=$(go env GOROOT)
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/io" \
            -v "$go_root:/opt/requests-utls-go:ro" \
            -w /io \
            -e WHEEL_PLATFORM \
            -e GOROOT=/opt/requests-utls-go \
            -e GOTOOLCHAIN=local \
            -e GOPATH=/tmp/requests-utls-gopath \
            -e GOCACHE=/tmp/requests-utls-gocache \
            "$MANYLINUX_IMAGE" /bin/bash -euo pipefail -c '
              export PATH="/opt/python/cp311-cp311/bin:/opt/requests-utls-go/bin:$PATH"
              git config --global --add safe.directory /io/engine
              python -m pip install build twine auditwheel "setuptools>=77" wheel
              python scripts/ci_wheel.py build --engine-dir /io/engine --output-dir /io/ci-dist --platform "$WHEEL_PLATFORM"
            '
      - name: Install macOS wheel audit tools
        if: runner.os == 'macOS'
        run: python -m pip install build twine delocate "setuptools>=77" wheel
      - name: Install Windows wheel audit tools
        if: runner.os == 'Windows'
        run: python -m pip install build twine delvewheel "setuptools>=77" wheel
      - name: Build, audit and test macOS or Windows
        if: runner.os != 'Linux'
        env:
          WHEEL_PLATFORM: ${{ matrix.platform }}
          GOTOOLCHAIN: local
        run: python scripts/ci_wheel.py build --engine-dir engine --output-dir ci-dist --platform "${{ env.WHEEL_PLATFORM }}"
      - name: Upload the tested wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.platform }}
          path: ci-dist/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete tested wheel set
    needs: wheels
    if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/requests-utls
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheel-*
          path: release-dist
          merge-multiple: true
      - name: Verify all five bundled wheels and their release version
        run: |
          python -m pip install packaging twine
          python scripts/ci_wheel.py verify-release --wheel-dir release-dist
      - name: Publish wheels through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release-dist
          attestations: true
